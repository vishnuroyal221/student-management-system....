const lab=(m,k)=>k=='id'?'ID':(m.f.find(x=>x[0]==k)||[,(m.c||{})[k]?.[0]||k])[1];
function page(k){const m=M[k],s=st[k]=st[k]||{q:'',f:{},s:'id',d:1,p:1},W=canW(k);
$('#main').innerHTML=`<h1 style="margin-top:0">${m.t}</h1><div class="bar"><input placeholder="Search…" value="${esc(s.q)}" oninput="st['${k}'].q=this.value;st['${k}'].p=1;tbl('${k}')">${(m.flt||[]).map(f=>`<select onchange="st['${k}'].f['${f}']=this.value;st['${k}'].p=1;tbl('${k}')"><option value="">All ${lab(m,f)}</option>${[...new Set(D[k].map(r=>r[f]))].map(o=>`<option ${s.f[f]==o?'selected':''}>${esc(o)}</option>`).join('')}</select>`).join('')}<span class="sp"></span>
${W?`<button class="btn p" onclick="form('${k}')">＋ Add New</button>`:''}<button class="btn" onclick="exp('${k}')">⭳ CSV</button><button class="btn" onclick="print()">🖨 Print</button></div><div class="card tw" id="tb"></div><div id="grid"></div>`;tbl(k)}
function tbl(k){const m=M[k],s=st[k],W=canW(k);let rows=D[k].map(r=>row(m,r)).filter(r=>(!s.q||Object.values(r).join(' ').toLowerCase().includes(s.q.toLowerCase()))&&Object.entries(s.f).every(([a,b])=>!b||r[a]==b));
rows.sort((a,b)=>(a[s.s]>b[s.s]?1:a[s.s]<b[s.s]?-1:0)*s.d);const n=rows.length,pp=Math.max(1,Math.ceil(n/8));s.p=Math.min(s.p,pp);const sl=rows.slice((s.p-1)*8,s.p*8);
const cell=(r,c)=>m.money?.includes(c)?inr(r[c]):c=='salary'?inr(r[c]):badge(r[c]);
$('#tb').innerHTML=n?`<table><thead><tr>${m.cols.map(c=>`<th onclick="srt('${k}','${c}')">${lab(m,c)}${s.s==c?(s.d>0?' ▲':' ▼'):''}</th>`).join('')}<th class="noprint">Actions</th></tr></thead><tbody>${sl.map(r=>`<tr>${m.cols.map(c=>`<td>${cell(r,c)}</td>`).join('')}<td class="noprint"><button class="btn s" onclick="view('${k}','${r.id}')">View</button> ${m.rec?`<button class="btn s" onclick="receipt('${r.id}')">Receipt</button> `:''}${m.rep?`<button class="btn s" onclick="card('${r.id}')">Report</button> `:''}${W?`<button class="btn s" onclick="form('${k}','${r.id}')">Edit</button> <button class="btn s d" onclick="del('${k}','${r.id}')">Delete</button>`:''}</td></tr>`).join('')}</tbody></table>
<div class="noprint" style="display:flex;justify-content:space-between;align-items:center;padding-top:12px"><span class="mu">${n} record(s) · Page ${s.p}/${pp}</span><span><button class="btn s" ${s.p<2?'disabled':''} onclick="st['${k}'].p--;tbl('${k}')">‹ Prev</button> <button class="btn s" ${s.p>=pp?'disabled':''} onclick="st['${k}'].p++;tbl('${k}')">Next ›</button></span></div>`:`<div class="emp"><div style="font-size:40px">📂</div><b>No records found</b><br>Try changing your search or filters.</div>`;
if(m.grid){const c=s.f.cls||C[0];$('#grid').innerHTML=`<h3>Weekly Timetable – Class ${c}</h3><div class="card tw"><table class="tt"><tr>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr><tr>${DAYS.map(d=>`<td>${D.timetable.filter(t=>t.cls==c&&t.day==d).sort((a,b)=>a.start>b.start?1:-1).map(t=>`<div class="li"><b>${t.start}–${t.end}</b><br>${esc(t.subject)}<br><span class="mu">${esc(t.teacher)} · ${esc(t.room)}</span></div>`).join('')||'<span class="mu">—</span>'}</td>`).join('')}</tr></table></div>`}}
const srt=(k,c)=>{const s=st[k];s.d=s.s==c?-s.d:1;s.s=c;tbl(k)};
function form(k,id){const m=M[k],r=id?D[k].find(x=>x.id==id):{};modal(`<h3 style="margin-top:0">${id?'Edit':'Add'} ${m.t.split(' ')[0]}</h3><div class="fg">${m.f.map(([key,l,t,o])=>{const v=r[key]??'';return`<div ${t=='textarea'?'style="grid-column:1/-1"':''}><label>${l} *</label>${t=='select'?`<select id="f_${key}"><option value="">Select…</option>${(typeof o=='function'?o():o).map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t=='textarea'?`<textarea id="f_${key}" rows="3">${esc(v)}</textarea>`:`<input id="f_${key}" type="${t}" value="${esc(v)}" ${t=='number'?'min="0"':''}>`}<em id="e_${key}"></em></div>`}).join('')}</div><div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeM()">Cancel</button> <button class="btn p" onclick="saveF('${k}','${id||''}')">Save</button></div>`)}
function saveF(k,id){const m=M[k],o={};let ok=1;m.f.forEach(([key,l,t])=>{const el=$('#f_'+key),v=el.value.trim(),e=$('#e_'+key);let msg='';if(!v)msg='Required';else if(t=='email'&&!/^\S+@\S+\.\S+$/.test(v))msg='Invalid email';else if(t=='tel'&&!/^[0-9+\- ]{7,15}$/.test(v))msg='Invalid phone';e.textContent=msg;el.classList.toggle('bad',!!msg);if(msg)ok=0;o[key]=t=='number'?+v:v});if(!ok)return toast('Please fix the highlighted fields');
if(id)Object.assign(D[k].find(x=>x.id==id),o);else{const n=Math.max(0,...D[k].map(x=>+x.id.slice(-3)))+1;D[k].push({id:pad(m.p,n),...o})}save();closeM();toast(id?'Record updated':'Record added');render()}
const del=(k,id)=>confirmD('This record will be permanently removed.',()=>{D[k]=D[k].filter(x=>x.id!=id);save();toast('Record deleted');render()});
function view(k,id){const m=M[k],r=row(m,D[k].find(x=>x.id==id));modal(`<h3 style="margin-top:0">Details – ${esc(r.id)}</h3>${Object.keys(r).map(c=>`<div class="li"><span class="mu">${lab(m,c)}:</span> <b>${m.money?.includes(c)?inr(r[c]):badge(r[c])}</b></div>`).join('')}<div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Close</button></div>`)}
const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click()};
function csv(n,heads,rows){dl(n+'.csv',[heads,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'))}
function exp(k){const m=M[k];csv(k,m.cols.map(c=>lab(m,c)),D[k].map(r=>{const x=row(m,r);return m.cols.map(c=>x[c])}));toast('CSV exported')}
function receipt(id){const r=row(M.fees,D.fees.find(x=>x.id==id));document.body.classList.add('pm');modal(`<h2 style="text-align:center;margin:0">${esc(D.set.name)}</h2><p style="text-align:center" class="mu">Fee Receipt · ${r.id}</p><table><tr><td>Student</td><td><b>${esc(r.student)}</b></td></tr><tr><td>Tuition</td><td>${inr(r.tuition)}</td></tr><tr><td>Transport</td><td>${inr(r.transport)}</td></tr><tr><td>Library</td><td>${inr(r.library)}</td></tr><tr><td>Examination</td><td>${inr(r.exam)}</td></tr><tr><td><b>Total</b></td><td><b>${inr(r.total)}</b></td></tr><tr><td>Paid (${r.method}, ${r.date})</td><td>${inr(r.paid)}</td></tr><tr><td>Pending</td><td>${inr(r.pending)}</td></tr><tr><td>Status</td><td>${badge(r.status)}</td></tr></table><div class="noprint" style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Close</button> <button class="btn p" style="display:inline-block" onclick="print()">Print</button></div>`)}
function card(id){const r=row(M.results,D.results.find(x=>x.id==id)),all=D.results.filter(x=>x.student==r.student).map(x=>row(M.results,x));document.body.classList.add('pm');modal(`<h2 style="text-align:center;margin:0">${esc(D.set.name)}</h2><p style="text-align:center" class="mu">Report Card – ${esc(r.student)}</p><table><tr>${['Examination','Marks','Max','%','Grade','Result'].map(h=>`<th>${h}</th>`).join('')}</tr>${all.map(x=>`<tr><td>${esc(x.exam)}</td><td>${x.marks}</td><td>${x.max}</td><td>${x.pct}</td><td>${x.grade}</td><td>${badge(x.res)}</td></tr>`).join('')}</table><div class="noprint" style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Close</button> <button class="btn p" style="display:inline-block" onclick="print()">Print</button></div>`)}
/* attendance */
const AST=['Present','Absent','Late','Leave'],pctA=id=>{let p=0,t=0;Object.values(D.att).forEach(d=>{if(d[id]){t++;if(d[id]=='Present'||d[id]=='Late')p++}});return t?Math.round(p/t*100):0};
function attendance(){const sts=D.students.filter(s=>s.cls==A.cls),sv=D.att[A.date]||{};sts.forEach(s=>{A.cur[s.id]=A.cur[s.id]||sv[s.id]||'Present'});const cnt=x=>sts.filter(s=>A.cur[s.id]==x).length,W=canW('attendance')||U.role=='Teacher';
$('#main').innerHTML=`<h1 style="margin-top:0">Attendance Management</h1><div class="bar"><input type="date" value="${A.date}" onchange="A.date=this.value;A.cur={};attendance()"><select onchange="A.cls=this.value;A.cur={};attendance()">${C.map(c=>`<option ${c==A.cls?'selected':''}>${c}</option>`).join('')}</select><span class="sp"></span><button class="btn" onclick="sts_all()">Mark all Present</button><button class="btn p" onclick="attSave()">💾 Save Attendance</button><button class="btn" onclick="attCsv()">⭳ Monthly Report CSV</button></div>
<div class="grid">${AST.map(x=>`<div class="card stat"><b>${cnt(x)}</b><span>${x}</span></div>`).join('')}<div class="card stat"><b>${sts.length?Math.round((cnt('Present')+cnt('Late'))/sts.length*100):0}%</b><span>Day attendance</span></div></div>
<div class="card tw">${sts.length?`<table><tr><th>ID</th><th>Student</th><th>Status</th><th>Mark</th><th>Overall %</th></tr>${sts.map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${badge(A.cur[s.id])}</td><td>${AST.map(x=>`<button class="btn s ${A.cur[s.id]==x?'p':''}" onclick="A.cur['${s.id}']='${x}';attendance()">${x[0]}${x=='Leave'?'v':''}</button>`).join(' ')}</td><td>${pctA(s.id)}%</td></tr>`).join('')}</table>`:'<div class="emp">No students in this class.</div>'}</div>`}
const sts_all=()=>{Object.keys(A.cur).forEach(k=>A.cur[k]='Present');attendance()};
const attSave=()=>{D.att[A.date]=Object.assign(D.att[A.date]||{},A.cur);save();toast('Attendance saved for '+A.date);attendance()};
const attCsv=()=>csv('attendance-report',['ID','Student','Class','Present/Late days','Recorded days','Percentage'],D.students.map(s=>{const d=Object.values(D.att).filter(x=>x[s.id]);return[s.id,s.name,s.cls,d.filter(x=>x[s.id]=='Present'||x[s.id]=='Late').length,d.length,pctA(s.id)+'%']}));
/* dashboard */
function dash(){const ts=D.att[today]||{},v=Object.values(ts),pend=D.fees.reduce((a,f)=>a+tot(f)-f.paid,0),rev=D.fees.reduce((a,f)=>a+ +f.paid,0),admin=['Super Admin','Administrator'].includes(U.role),
S=[['Total Students',D.students.length],['Total Teachers',D.teachers.length],['Total Classes',D.classes.length],['Total Courses',D.courses.length],['Present Today',v.filter(x=>x=='Present').length],['Absent Today',v.filter(x=>x=='Absent').length],['Pending Fees',inr(pend)],['Total Revenue',inr(rev)]];
const nt=D.notices.filter(n=>n.status=='Active');
$('#main').innerHTML=`<h1 style="margin-top:0">Welcome, ${esc(U.name)}</h1><p class="mu" style="margin-top:-8px">${U.role} dashboard · ${new Date().toDateString()}</p>${U.role=='Student'||U.role=='Parent'?'':`<div class="grid">${S.map(s=>`<div class="card stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>`}
${canW('students')?`<div class="bar"><span class="mu">Quick actions:</span><button class="btn p" onclick="go('students');setTimeout(()=>form('students'),50)">＋ Student</button><button class="btn" onclick="go('attendance')">Take Attendance</button><button class="btn" onclick="go('fees')">Collect Fees</button><button class="btn" onclick="go('reports')">Reports</button></div>`:''}
${U.role=='Student'||U.role=='Parent'?'':`<div class="grid g3"><div class="card"><h3 style="margin-top:0">Enrollment by Class</h3><canvas id="c1"></canvas></div><div class="card"><h3 style="margin-top:0">Attendance Trend (%)</h3><canvas id="c2"></canvas></div><div class="card"><h3 style="margin-top:0">Fees Collection</h3><canvas id="c3"></canvas></div></div>`}
<div class="grid g3"><div class="card"><h3 style="margin-top:0">Recent Registrations</h3>${D.students.slice(-5).reverse().map(s=>`<div class="li">${esc(s.name)} <span class="mu">· ${s.cls} · ${s.adm}</span></div>`).join('')}</div><div class="card"><h3 style="margin-top:0">Upcoming Examinations</h3>${D.exams.filter(e=>e.date>=today).slice(0,5).map(e=>`<div class="li">${esc(e.name)} <span class="mu">· ${e.date}</span></div>`).join('')||'<div class="emp">None scheduled</div>'}</div><div class="card"><h3 style="margin-top:0">Latest Announcements</h3>${nt.slice(0,4).map(n=>`<div class="li">${badge(n.priority)} <b>${esc(n.title)}</b><br><span class="mu">${esc(n.desc)}</span></div>`).join('')||'<div class="emp">No notices</div>'}</div></div>`;
if(window.Chart&&$('#c1')){Chart.defaults.color=getComputedStyle(document.body).color;const P=['#142B4A','#245B9E','#198754','#E5A000','#DC3545'],days=[5,4,3,2,1,0].map(dOff),
mk=(id,c)=>charts.push(new Chart($(id),c));mk('#c1',{type:'bar',data:{labels:C,datasets:[{data:C.map(c=>D.students.filter(s=>s.cls==c).length),backgroundColor:P[1]}]},options:{plugins:{legend:{display:false}}}});
mk('#c2',{type:'line',data:{labels:days.map(d=>d.slice(5)),datasets:[{data:days.map(d=>{const x=Object.values(D.att[d]||{});return x.length?Math.round(x.filter(y=>y=='Present'||y=='Late').length/x.length*100):0}),borderColor:P[2],tension:.3}]},options:{plugins:{legend:{display:false}}}});
mk('#c3',{type:'doughnut',data:{labels:['Collected','Pending'],datasets:[{data:[rev,pend],backgroundColor:[P[2],P[3]]}]}})}}
/* reports */
function reports(){const R=[['Student enrollment','students'],['Fee collection / pending fees','fees'],['Examination results','results'],['Teacher report','teachers'],['Timetable','timetable'],['Library','books']];
$('#main').innerHTML=`<h1 style="margin-top:0">Reports & Analytics</h1><div class="grid">${R.map(r=>`<div class="card"><b>${r[0]}</b><p class="mu">CSV export of all records.</p><button class="btn p" onclick="exp('${r[1]}')">⭳ Export CSV</button></div>`).join('')}<div class="card"><b>Attendance report</b><p class="mu">Per-student percentage.</p><button class="btn p" onclick="attCsv()">⭳ Export CSV</button></div></div>
<h3>Class-wise Student Report</h3><div class="card tw"><table><tr><th>Class</th><th>Students</th><th>Male</th><th>Female</th><th>Avg Attendance</th></tr>${C.map(c=>{const s=D.students.filter(x=>x.cls==c);return`<tr><td>${c}</td><td>${s.length}</td><td>${s.filter(x=>x.gender=='Male').length}</td><td>${s.filter(x=>x.gender=='Female').length}</td><td>${s.length?Math.round(s.reduce((a,x)=>a+pctA(x.id),0)/s.length):0}%</td></tr>`}).join('')}</table></div><br><button class="btn" onclick="print()">🖨 Print</button>`}
/* settings */
function config(){$('#main').innerHTML=`<h1 style="margin-top:0">Settings</h1><div class="grid g3"><div class="card"><h3 style="margin-top:0">Institution</h3><label>Name</label><input id="sn" value="${esc(D.set.name)}" ${ROLES[U.role]=='all'?'':'disabled'}><br><br><button class="btn p" ${ROLES[U.role]=='all'?'':'disabled'} onclick="D.set.name=sn.value.trim()||D.set.name;save();applyTheme();toast('Saved')">Save</button></div>
<div class="card"><h3 style="margin-top:0">Theme</h3><select onchange="D.set.theme=this.value;save();applyTheme()">${['auto','light','dark'].map(t=>`<option ${D.set.theme==t?'selected':''}>${t}</option>`).join('')}</select></div>
<div class="card"><h3 style="margin-top:0">Change Password</h3><input type="password" id="pw" placeholder="New password (min 6)"><br><br><button class="btn p" onclick="pw.value.length<6?toast('Min 6 characters'):(pw.value='',toast('Password updated (demo)'))">Update</button></div>
${ROLES[U.role]=='all'?`<div class="card"><h3 style="margin-top:0">Data</h3><p class="mu">Reset all data to the sample records.</p><button class="btn d" onclick="confirmD('All changes will be lost and sample data restored.',()=>{D=seed();save();applyTheme();render();toast('Data reset')})">Reset Data</button></div>`:''}</div>`}
/* boot */
try{U=JSON.parse(localStorage.getItem('sms-u')||sessionStorage.getItem('sms-u'))}catch(e){}U={email:'admin@sterling.edu',role:'Super Admin',name:'Dr. A. Principal'};start();
</script></body></html>
